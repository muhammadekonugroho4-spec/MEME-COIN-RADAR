name: scan-mcr

on:
  schedule:
    - cron: "*/10 * * * *"   # crypto 24/7: tiap 10 menit
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan-mcr
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan meme coins
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m jobs.job_scan --max-new 15

      - name: Commit data
        run: |
          git config user.name "mcr-bot"
          git config user.email "mcr-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Tidak ada coin baru/observasi baru."
          else
            git commit -m "data: scan $(date -u +%F-%H:%M)"
            git pull --rebase origin main
            git push
          fi
