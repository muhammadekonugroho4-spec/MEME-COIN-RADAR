<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEME-COIN-RADAR</title>
<link rel="manifest" href="/static/manifest.json">
<style>
:root{--bg:#0b0f1a;--card:#121a2e;--line:#1f2b47;--txt:#dbe4f5;--dim:#7d8db0;--buy:#31c48d;--watch:#f5b942;--rej:#f05252;--acc:#5a8dee}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
h1{font-size:19px;margin:8px 0 4px}
.meta{color:var(--dim);font-size:13px;margin-bottom:14px}
nav{display:flex;gap:10px;margin:10px 0 16px;flex-wrap:wrap}
nav a{color:var(--acc);text-decoration:none;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px}
.sig{font-size:12px;padding:2px 8px;border-radius:6px;background:#0e1730;color:var(--warn,#f5b942);margin-right:8px}
.t{font-weight:700}
.d{color:var(--dim);font-size:13px}
.empty{padding:24px;text-align:center;color:var(--dim)}
/* kalender */
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.cal-head div{text-align:center;color:var(--dim);font-size:11px;padding:2px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .day{aspect-ratio:1.4;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card);font-size:11px}
.cal .day .pnl{font-weight:700;font-size:11px}
.cal .day.win{background:#0e2e22;border-color:#1d5c40}
.cal .day.loss{background:#331a1a;border-color:#6b2424}
.cal .day.flat{opacity:.55}
.cal .day .num{color:var(--dim)}
.pos{color:var(--buy)}.neg{color:var(--rej)}
.legend{display:flex;gap:12px;margin:8px 0 14px;font-size:12px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:12px;height:12px;border-radius:4px;display:inline-block}
</style>
</head>
<body>
<div class="wrap">
<h1>Radar Detektif</h1>
<nav><a href="/">Screener</a><a href="/radar">Radar Detektif</a><a href="/positions">Posisi</a><a href="/journal">Jurnal</a><a href="/stats">Statistik</a></nav>
<div class="meta" id="meta">memuat...</div>

<h2 style="font-size:15px;color:var(--acc)">Kalender PnL harian</h2>
<div class="legend">
  <span><i class="dot" style="background:#0e2e22;border:1px solid #1d5c40"></i> untung</span>
  <span><i class="dot" style="background:#331a1a;border:1px solid #6b2424"></i> rugi</span>
  <span><i class="dot" style="background:var(--card);border:1px solid var(--line)"></i> netral / tanpa trade</span>
</div>
<div class="cal-head"><div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div>Sab</div><div>Min</div></div>
<div class="cal" id="cal"></div>

<h2 style="font-size:15px;color:var(--acc);margin-top:18px">Temuan hari ini</h2>
<div id="list"><div class="card empty">memuat...</div></div>
</div>
<script>
const MONTHS=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
function renderCalendar(days){
  const el=document.getElementById('cal'); el.innerHTML='';
  const today=new Date();
  const y=today.getFullYear(), m=today.getMonth();
  const first=new Date(y,m,1);
  const offset=(first.getDay()+6)%7; // Senin=0
  const dim=new Date(y,m+1,0).getDate();
  for(let i=0;i<offset;i++){el.insertAdjacentHTML('beforeend','<div></div>');}
  for(let d=1;d<=dim;d++){
    const key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const rec=days[key];
    let cls='day flat', txt='·';
    if(rec){
      const pnl=Number(rec.pnl);
      if(pnl>0.0001){cls='day win'; txt=`+$${pnl.toFixed(2)}`;}
      else if(pnl<-0.0001){cls='day loss'; txt=`-$${Math.abs(pnl).toFixed(2)}`;}
      else {cls='day flat'; txt='±$0';}
    }
    el.insertAdjacentHTML('beforeend',`<div class="${cls}"><span class="num">${d}</span><span class="pnl">${txt}</span></div>`);
  }
}
fetch('/api/radar').then(r=>r.json()).then(d=>{
  const m=d.manifest||{};
  document.getElementById('meta').textContent=`Data: ${d.day} | ${d.findings.length} temuan`;
  const el=document.getElementById('list');
  if(!d.findings.length){el.innerHTML='<div class="card empty">Tidak ada temuan hari ini.</div>';}
  else{
    el.innerHTML=d.findings.map(f=>`<div class="card">
      <span class="sig">${(f.signal||'').toUpperCase()}</span>
      <span class="t">${f.ticker||f.symbol||''}</span> <span>$${f.close??''}</span>
      <div class="d">${f.detail||''}</div></div>`).join('');
  }
  return fetch('/api/calendar').then(r=>r.json());
}).then(cal=>{
  renderCalendar(cal.days||{});
  document.getElementById('meta').textContent+=' | kalender diperbarui';
}).catch(e=>document.getElementById('meta').textContent='gagal memuat API');
</script>
</body>
</html>
