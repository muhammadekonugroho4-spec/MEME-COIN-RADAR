<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEME-COIN-RADAR - Jurnal</title>
<link rel="manifest" href="/static/manifest.json">
<style>
:root{--bg:#0b0f1a;--card:#121a2e;--line:#1f2b47;--txt:#dbe4f5;--dim:#7d8db0;--up:#31c48d;--down:#f05252;--acc:#5a8dee}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
h1{font-size:19px;margin:8px 0 10px}h1 span{color:var(--acc)}
nav{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
nav a{color:var(--acc);text-decoration:none;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:14px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden;margin-bottom:14px}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;font-size:13px}
th{background:#0e1730;color:var(--dim);text-align:right}
th:first-child,td:first-child,td:last-child{text-align:left}
td:last-child{max-width:300px;color:var(--dim);font-size:12px}
.buy{color:var(--up)}.sell{color:var(--down)}
.empty{padding:16px;text-align:center;color:var(--dim)}
.dis{color:var(--dim);font-size:11px;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<h1>Jurnal <span>Trades</span></h1>
<nav><a href="/">Radar</a><a href="/positions">Posisi</a><a href="/journal">Jurnal</a><a href="/stats">Statistik</a></nav>
<table><thead><tr><th>Waktu</th><th>Coin</th><th>Side</th><th>Qty</th><th>Harga</th><th>USD</th><th>Slip%</th><th>Alasan</th></tr></thead>
<tbody id="tb"></tbody></table>
<div class="dis">Simulasi virtual — bukan saran finansial.</div>
</div>
<script>
fetch('/api/journal').then(r=>r.json()).then(d=>{
  const tb=document.getElementById('tb');
  if(!d.trades.length){tb.innerHTML='<tr><td colspan="8" class="empty">Belum ada trade. Bot membeli virtual saat ada coin zona BUY.</td></tr>';return;}
  tb.innerHTML=d.trades.reverse().map(t=>`<tr>
    <td>${(t.ts||'').slice(5,16)}</td>
    <td><b>${t.symbol||'?'}</b><div style="color:var(--dim);font-size:10px">${(t.mint||'').slice(0,8)}…</div></td>
    <td class="${t.side==='buy'?'buy':'sell'}">${t.side}</td>
    <td>${Number(t.qty).toPrecision(4)}</td><td>${t.price}</td><td>${Number(t.usd).toFixed(2)}</td>
    <td>${t.slippage_pct}</td><td>${t.reason||''}</td></tr>`).join('');
}).catch(()=>document.getElementById('tb').innerHTML='<tr><td colspan="8" class="empty">gagal memuat</td></tr>');
</script>
</body>
</html>
